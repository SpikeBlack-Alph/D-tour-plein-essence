<!DOCTYPE html>
<html lang="fr" data-theme="sombre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ça vaut le détour ? — calculateur pompe A / pompe B</title>
<meta name="description" content="Calcule si aller faire le plein à la pompe la moins chère reste rentable une fois le détour payé.">
<meta name="theme-color" content="#0a0c0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- neutre + accent vert, sombre par défaut ---- */
    --papier:#0a0c0b;
    --carte:#15181654;
    --carte:#161a18;
    --carte-elevee:#1c211e;
    --plaque:#12281c;
    --plaque-fond:#0c1c14;
    --trait:#262b28;
    --trait-fonce:#333b36;
    --encre:#eef1ef;
    --sourdine:#8b948e;
    --signal:#2fdb82;
    --signal-texte:#04140b;
    --feuille:#8fe6a4;
    --moutarde:#e5b94f;
    --brique:#ff7a68;
    --lueur:rgba(47,219,130,.10);
    --elev-1:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 24px -18px rgba(0,0,0,.7);
    --elev-2:0 1px 0 rgba(255,255,255,.05) inset, 0 22px 48px -24px rgba(0,0,0,.85);

    --display:"Bricolage Grotesque","Helvetica Neue",sans-serif;
    --texte:"Instrument Sans",system-ui,sans-serif;
    --chiffres:"Martian Mono",ui-monospace,monospace;

    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;
    --r-sm:9px; --r-md:13px; --r-lg:17px; --r-pill:999px;
    --air:clamp(10px,2.2vh,var(--s6));
  }

  html[data-theme="clair"]{
    --papier:#f3f5f2;
    --carte:#ffffff;
    --carte-elevee:#ffffff;
    --plaque:#123a26;
    --plaque-fond:#0b2417;
    --trait:#e3e8e1;
    --trait-fonce:#cfd8cc;
    --encre:#131a15;
    --sourdine:#69766e;
    --signal:#189a55;
    --signal-texte:#ffffff;
    --feuille:#bdf0c8;
    --moutarde:#a97c12;
    --brique:#c23b28;
    --lueur:rgba(24,154,85,.08);
    --elev-1:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 22px -16px rgba(20,35,26,.22);
    --elev-2:0 1px 0 rgba(255,255,255,.7) inset, 0 24px 46px -22px rgba(20,35,26,.28);
  }

  /* texte constant posé sur les îlots vert foncé, quel que soit le thème */
  :root, html[data-theme="clair"]{ --texte-ilot:#eef8f0; }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--papier);
    background-image:radial-gradient(120% 46% at 50% -6%, var(--lueur), rgba(0,0,0,0) 60%);
    color:var(--encre);
    font-family:var(--texte);font-size:16px;line-height:1.4;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    padding:max(16px,env(safe-area-inset-top)) var(--s5) max(16px,env(safe-area-inset-bottom));
    display:flex;
    transition:background-color .3s ease,color .3s ease;
  }
  .page{max-width:430px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}

  /* ---- interrupteur de thème ---- */
  .bascule-theme{
    position:fixed;top:max(14px,env(safe-area-inset-top));right:var(--s4);z-index:10;
    width:54px;height:30px;padding:2px;
    background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-pill);
    cursor:pointer;box-shadow:var(--elev-1);
    transition:background-color .25s ease,border-color .25s ease;
  }
  .bascule-theme:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .bascule-theme .curseur{
    width:24px;height:24px;border-radius:50%;
    background:var(--signal);
    display:flex;align-items:center;justify-content:center;
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  html[data-theme="clair"] .bascule-theme .curseur{transform:translateX(24px)}
  .bascule-theme svg{position:absolute;width:14px;height:14px;color:var(--signal-texte);transition:opacity .2s ease}
  .bascule-theme .lune{opacity:1}
  .bascule-theme .soleil{opacity:0}
  html[data-theme="clair"] .bascule-theme .lune{opacity:0}
  html[data-theme="clair"] .bascule-theme .soleil{opacity:1}

  /* ---- titre ---- */
  .fil{margin:0 0 calc(var(--air) * 1.2);padding-right:56px}
  .eyebrow{
    font-family:var(--chiffres);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--signal);margin:0 0 var(--s1);font-weight:700;
  }
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(25px,8vw,36px);letter-spacing:-.025em;line-height:.98;margin:0;color:var(--encre);
  }
  h1 em{font-style:normal;color:var(--signal)}
  .sous{
    display:block;margin-top:var(--s1);
    font-family:var(--texte);font-size:13px;color:var(--sourdine);
  }

  /* ---- raccourcis véhicules ---- */
  .flotte{display:flex;gap:var(--s2);margin:0 0 var(--air)}
  .puce{
    flex:1 1 auto;min-height:52px;
    background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-md);
    padding:var(--s2) var(--s2);cursor:pointer;box-shadow:var(--elev-1);
    font-family:var(--texte);font-size:14px;font-weight:600;color:var(--encre);
    line-height:1.25;text-align:center;
    transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease,box-shadow .15s ease;
  }
  .puce small{display:block;font-family:var(--chiffres);font-size:10.5px;font-weight:500;color:var(--sourdine);margin-top:3px}
  .puce:hover{border-color:var(--signal)}
  .puce:active{transform:translateY(1px)}
  .puce[aria-pressed="true"]{background:var(--plaque);border-color:var(--plaque);color:var(--texte-ilot);box-shadow:var(--elev-2)}
  .puce[aria-pressed="true"] small{color:var(--feuille)}
  .puce:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* ---- champs empilés ---- */
  .totem{
    background:var(--carte);border:1px solid var(--trait);
    border-radius:var(--r-lg);padding:var(--s1) var(--s5);
    box-shadow:var(--elev-1);
    position:relative;overflow:hidden;
    transition:background-color .3s ease,border-color .3s ease;
  }
  .totem::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--signal),var(--feuille));
  }
  .champ{
    display:flex;align-items:center;gap:var(--s3);
    padding:clamp(10px,2vh,15px) 0;border-bottom:1px solid var(--trait);
    min-height:52px;
  }
  .champ:last-child{border-bottom:none}
  .champ label{flex:1;font-size:14.5px;font-weight:600;line-height:1.2}
  .champ .note{display:block;color:var(--sourdine);font-size:11px;font-weight:400;margin-top:2px}
  .saisie{display:flex;align-items:baseline;gap:var(--s1);flex:none}
  .champ input{
    width:3ch;min-width:2ch;max-width:9ch;
    background:transparent;border:none;border-bottom:2px solid var(--trait);
    color:var(--signal);font-family:var(--chiffres);font-size:19px;font-weight:700;
    text-align:right;padding:3px 1px;
    transition:width .12s ease;
  }
  .miroir-mesure{
    position:absolute;top:-9999px;left:-9999px;white-space:pre;visibility:hidden;
    font-family:var(--chiffres);font-size:19px;font-weight:700;
  }
  .champ input::placeholder{color:var(--sourdine);opacity:.5}
  .champ input:focus{outline:none;border-bottom-color:var(--signal)}
  .champ input:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:2px}
  .champ.manque input{border-bottom-color:var(--brique);color:var(--brique)}
  .champ.prerempli{background:var(--plaque);border-radius:var(--r-sm);margin:0 calc(var(--s5) * -1);padding:clamp(10px,2vh,15px) var(--s5)}
  .champ.prerempli label,
  .champ.prerempli .note{color:var(--feuille)}
  .champ.prerempli input{color:var(--feuille);border-bottom-color:var(--feuille)}
  .champ.prerempli .unite{color:var(--texte-ilot);opacity:.75}
  .unite{font-family:var(--chiffres);font-size:10.5px;color:var(--sourdine);width:4.6ch}

  #calculer{
    width:100%;margin-top:var(--air);min-height:56px;
    background:linear-gradient(180deg,var(--signal),color-mix(in srgb,var(--signal) 82%,black));
    color:var(--signal-texte);border:none;border-radius:var(--r-md);
    font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;
    padding:14px;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 14px 30px -16px color-mix(in srgb,var(--signal) 55%,transparent);
    transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;
  }
  #calculer:hover{filter:brightness(1.06)}
  #calculer:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset}
  #calculer:focus-visible{outline:3px solid var(--encre);outline-offset:3px}

  .erreur{color:var(--brique);font-size:12.5px;margin:var(--s2) 0 0;text-align:center}
  .erreur:empty{display:none}

  /* ---- plaque de résultat ---- */
  .verdict{
    background:var(--plaque-fond);color:var(--texte-ilot);
    border:1px solid var(--plaque);border-radius:var(--r-lg);
    padding:clamp(18px,3.2vh,26px) var(--s5) clamp(12px,2vh,18px);
    box-shadow:var(--elev-2);
    text-align:center;
  }
  .mot{
    display:inline-flex;align-items:center;gap:7px;
    margin:0 0 var(--s3);padding:6px 14px;border-radius:var(--r-pill);
    font-family:var(--display);font-weight:800;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  }
  .mot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .mot.gagne{color:var(--feuille);background:rgba(143,230,164,.13)}
  .mot.perd{color:#ff9d8c;background:rgba(255,157,140,.13)}
  .somme{
    font-family:var(--chiffres);font-weight:700;
    font-size:clamp(2rem,7vh,3.2rem);line-height:1;margin:0;
  }
  .somme small{
    font-family:var(--texte);font-size:.32em;display:block;margin-top:var(--s2);
    color:#a3bfad;font-weight:400;letter-spacing:.01em;
  }
  .gagne{color:var(--feuille)}
  .perd{color:#ff9d8c}

  .jauge{margin:clamp(10px,2vh,18px) 0 var(--s2);height:7px;background:#04100a;border:1px solid var(--trait-fonce);border-radius:var(--r-pill);overflow:hidden}
  .jauge span{display:block;height:100%;width:0;background:var(--moutarde);transition:width .55s cubic-bezier(.4,0,.2,1)}
  .jauge.plein span{background:var(--brique)}
  .jauge-legende{
    display:flex;justify-content:space-between;gap:var(--s3);
    font-family:var(--chiffres);font-size:9px;letter-spacing:.04em;color:#8ea497;text-transform:uppercase;
  }

  .detail{margin:clamp(10px,2vh,18px) 0 0;padding:0;list-style:none;border-top:1px solid var(--trait-fonce);text-align:left}
  .detail li{
    display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline;
    padding:clamp(6px,1.1vh,10px) 0;border-bottom:1px solid #142019;font-size:12.5px;
  }
  .detail b{font-family:var(--chiffres);font-weight:500;font-size:12.5px;white-space:nowrap;color:var(--texte-ilot)}
  .detail .libelle{color:#9ab3a4}
  .conclusion{margin:clamp(8px,1.6vh,14px) 0 0;font-size:12.5px;line-height:1.45;text-align:left;color:#c3d6c9}
  .conclusion strong{color:var(--feuille);font-weight:600}

  .retour{
    width:100%;margin-top:var(--air);min-height:50px;
    background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-md);color:var(--encre);
    font-family:var(--texte);font-weight:600;font-size:14.5px;padding:12px;cursor:pointer;
    box-shadow:var(--elev-1);
    transition:border-color .15s ease,color .15s ease;
  }
  .retour:hover{border-color:var(--signal);color:var(--signal)}
  .retour:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  /* ---- deux vues, une seule visible ---- */
  .vue-saisie, .vue-resultat{min-height:0}
  .vue-resultat[hidden], .vue-saisie[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<span class="miroir-mesure" id="miroirMesure" aria-hidden="true"></span>

<button type="button" class="bascule-theme" id="basculeTheme" aria-pressed="false" aria-label="Passer en thème clair">
  <span class="curseur">
    <svg class="lune" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.7A8.5 8.5 0 1 1 9.3 3.5a7 7 0 0 0 11.2 11.2Z"/></svg>
    <svg class="soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
  </span>
</button>

<main class="page">

  <div class="fil">
    <p class="eyebrow">Pompe A · Pompe B</p>
    <h1>Ça vaut <em>le détour ?</em></h1>
    <span class="sous">Pompe A moins chère, pompe B plus proche</span>
  </div>

  <div class="vue-saisie" id="vueSaisie">
    <div class="flotte">
      <button type="button" class="puce" data-conso="7.5" data-volume="50" aria-pressed="false">Sandero GPL <small>7,5 · 50 L</small></button>
      <button type="button" class="puce" data-conso="5.7" data-volume="50" aria-pressed="false">Sandero SP98 <small>5,7 · 50 L</small></button>
      <button type="button" class="puce" data-conso="6" data-volume="45" aria-pressed="false">Ibiza <small>6 · 45 L</small></button>
    </div>

    <div class="totem">
      <div class="champ">
        <label for="conso">Consommation</label>
        <div class="saisie">
          <input id="conso" inputmode="decimal" placeholder="6,5" autocomplete="off">
          <span class="unite">L/100</span>
        </div>
      </div>
      <div class="champ">
        <label for="volume">Volume du plein</label>
        <div class="saisie">
          <input id="volume" inputmode="decimal" placeholder="45" autocomplete="off">
          <span class="unite">L</span>
        </div>
      </div>
      <div class="champ">
        <label for="prixA">Prix pompe A<span class="note">La moins chère, celle du détour</span></label>
        <div class="saisie">
          <input id="prixA" inputmode="decimal" placeholder="1,749" autocomplete="off">
          <span class="unite">€/L</span>
        </div>
      </div>
      <div class="champ">
        <label for="prixB">Prix pompe B<span class="note">La plus proche, la plus chère</span></label>
        <div class="saisie">
          <input id="prixB" inputmode="decimal" placeholder="1,899" autocomplete="off">
          <span class="unite">€/L</span>
        </div>
      </div>
      <div class="champ">
        <label for="detour">Détour total<span class="note">Tous les km en plus, aller-retour compris</span></label>
        <div class="saisie">
          <input id="detour" inputmode="decimal" placeholder="14" autocomplete="off">
          <span class="unite">km</span>
        </div>
      </div>
    </div>

    <button type="button" id="calculer">Rentable ?</button>
    <p class="erreur" id="erreur" role="alert"></p>
  </div>

  <div class="vue-resultat" id="vueResultat" hidden>
    <section class="verdict" aria-live="polite">
      <p class="mot" id="mot"></p>
      <p class="somme" id="somme"></p>

      <div class="jauge" id="jauge"><span id="jaugeFill"></span></div>
      <div class="jauge-legende">
        <span>Économie mangée par le détour</span>
        <span id="jaugePct"></span>
      </div>

      <ul class="detail">
        <li><span class="libelle">Économie brute sur le plein</span> <b id="brut"></b></li>
        <li><span class="libelle" id="libDetour">Carburant du détour</span> <b id="coutDetour"></b></li>
        <li><span class="libelle">Litre pompe A, détour compris</span> <b id="reel"></b></li>
      </ul>

      <p class="conclusion" id="conclusion"></p>
    </section>

    <button type="button" class="retour" id="modifier">Modifier les valeurs</button>
  </div>

</main>

<script>
(function(){
  var ids = ['conso','volume','prixA','prixB','detour'];
  var erreur = document.getElementById('erreur');
  var vueSaisie = document.getElementById('vueSaisie');
  var vueResultat = document.getElementById('vueResultat');

  function lire(id){
    var v = document.getElementById(id).value.trim().replace(',', '.');
    if (v === '') return NaN;
    var n = Number(v);
    return isFinite(n) ? n : NaN;
  }
  function marquer(id, ko){
    var champ = document.getElementById(id).parentNode.parentNode;
    if (ko) champ.classList.add('manque'); else champ.classList.remove('manque');
  }
  var miroir = document.getElementById('miroirMesure');
  function ajusterLargeur(id){
    var el = document.getElementById(id);
    var contenu = el.value || el.placeholder || '';
    miroir.textContent = contenu;
    var largeur = miroir.getBoundingClientRect().width;
    el.style.width = Math.max(largeur + 6, 20) + 'px';
  }
  function preremplir(id, actif){
    var champ = document.getElementById(id).parentNode.parentNode;
    if (actif) champ.classList.add('prerempli'); else champ.classList.remove('prerempli');
  }
  function euros(n){
    return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  }
  function parLitre(n){
    return n.toLocaleString('fr-FR', {minimumFractionDigits:3, maximumFractionDigits:3}) + ' €/L';
  }
  function nb(n, d){
    return n.toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:(d || 1)});
  }

  function animer(el, cible, classe){
    var legende = '<small>' + (cible >= 0 ? 'de gagné sur ce plein' : 'de perdu sur ce plein') + '</small>';
    var signe = cible >= 0 ? '+' : '−';
    el.className = 'somme ' + classe;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      el.innerHTML = signe + euros(Math.abs(cible)) + legende;
      return;
    }
    var debut = performance.now();
    function pas(t){
      var p = Math.min((t - debut) / 500, 1);
      var e = 1 - Math.pow(1 - p, 3);
      el.innerHTML = signe + euros(Math.abs(cible) * e) + legende;
      if (p < 1) requestAnimationFrame(pas);
    }
    requestAnimationFrame(pas);
  }

  function calculer(){
    var v = {}, manquants = [];
    ids.forEach(function(id){
      v[id] = lire(id);
      var ko = isNaN(v[id]) || v[id] < 0 || (id !== 'detour' && v[id] <= 0);
      marquer(id, ko);
      if (ko) manquants.push(id);
    });

    if (manquants.length){
      erreur.textContent = manquants.length > 1
        ? 'Complète les champs en rouge.'
        : 'Il manque une valeur valable dans le champ en rouge.';
      document.getElementById(manquants[0]).focus();
      return;
    }
    erreur.textContent = '';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

    var litresDetour = v.detour * v.conso / 100;
    var brut = v.volume * (v.prixB - v.prixA);
    var cout = litresDetour * v.prixA;
    var gain = brut - cout;
    var kmMax = brut > 0 ? brut / (v.conso / 100 * v.prixA) : 0;
    var prixReel = (v.volume * v.prixA + cout) / v.volume;

    var mot = document.getElementById('mot');
    mot.textContent = gain > 0 ? 'Oui, ça vaut le détour' : 'Non, reste à la pompe B';
    mot.className = 'mot ' + (gain > 0 ? 'gagne' : 'perd');
    animer(document.getElementById('somme'), gain, gain > 0 ? 'gagne' : 'perd');

    var part = brut > 0 ? Math.min(cout / brut * 100, 100) : 100;
    var jauge = document.getElementById('jauge');
    if (gain <= 0) jauge.classList.add('plein'); else jauge.classList.remove('plein');
    document.getElementById('jaugeFill').style.width = part + '%';
    document.getElementById('jaugePct').textContent = (brut > 0 ? Math.round(cout / brut * 100) + ' %' : '—');

    document.getElementById('brut').textContent = '+ ' + euros(brut);
    document.getElementById('libDetour').textContent =
      'Carburant du détour (' + nb(v.detour) + ' km · ' + nb(litresDetour, 2) + ' L)';
    document.getElementById('coutDetour').textContent = '− ' + euros(cout);
    document.getElementById('reel').textContent = parLitre(prixReel);

    var conclusion = document.getElementById('conclusion');
    if (v.prixB <= v.prixA){
      conclusion.innerHTML = 'La pompe A n\'est pas moins chère que la pompe B : le détour ne rapporte rien, quelle que soit la distance.';
    } else if (gain > 0){
      conclusion.innerHTML = 'Avec ces prix, le détour reste rentable jusqu\'à <strong>' + nb(kmMax) +
        ' km</strong> au total.';
    } else {
      conclusion.innerHTML = 'Il faudrait que le détour tienne en <strong>' + nb(kmMax) +
        ' km</strong> au total pour que l\'opération devienne intéressante.';
    }

    vueSaisie.hidden = true;
    vueResultat.hidden = false;
  }

  document.getElementById('calculer').addEventListener('click', calculer);

  document.getElementById('modifier').addEventListener('click', function(){
    vueResultat.hidden = true;
    vueSaisie.hidden = false;
    document.getElementById('prixA').focus();
  });

  ids.forEach(function(id){
    var el = document.getElementById(id);
    el.addEventListener('input', function(){
      marquer(id, false);
      if (id === 'conso' || id === 'volume') preremplir(id, false);
      ajusterLargeur(id);
    });
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); calculer(); }
    });
  });

  ids.forEach(function(id){
    ajusterLargeur(id);
  });

  var puces = document.querySelectorAll('.puce');
  Array.prototype.forEach.call(puces, function(puce){
    puce.addEventListener('click', function(){
      Array.prototype.forEach.call(puces, function(p){ p.setAttribute('aria-pressed', 'false'); });
      puce.setAttribute('aria-pressed', 'true');
      document.getElementById('conso').value = puce.getAttribute('data-conso').replace('.', ',');
      document.getElementById('volume').value = puce.getAttribute('data-volume');
      marquer('conso', false);
      marquer('volume', false);
      preremplir('conso', true);
      preremplir('volume', true);
      ajusterLargeur('conso');
      ajusterLargeur('volume');
      document.getElementById('prixA').focus();
    });
  });

  var basculeTheme = document.getElementById('basculeTheme');
  basculeTheme.addEventListener('click', function(){
    var racine = document.documentElement;
    var clair = racine.getAttribute('data-theme') === 'clair';
    racine.setAttribute('data-theme', clair ? 'sombre' : 'clair');
    basculeTheme.setAttribute('aria-pressed', String(!clair));
    basculeTheme.setAttribute('aria-label', clair ? 'Passer en thème clair' : 'Passer en thème sombre');
  });
})();
</script>
</body>
</html>
